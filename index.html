<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Commodore 64 BASIC Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Klasyczne barwy z palety VIC-II */
            --c64-dark: #352879;
            --c64-light: #6C5EB5;
        }

        body {
            background-color: var(--c64-light);
            margin: 0;
            padding: 0;
            font-family: 'VT323', 'Courier New', Courier, monospace; 
            text-transform: uppercase;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Gruby border typowy dla monitorów CRT */
        #monitor-border {
            background-color: var(--c64-light);
            width: 100%;
            height: 100%;
            padding: 8vw; 
            box-sizing: border-box;
            display: flex;
        }

        /* Ekran główny */
        #screen {
            background-color: var(--c64-dark);
            color: var(--c64-light);
            width: 100%;
            height: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
            font-size: 24px;
            line-height: 1.2;
            word-wrap: break-word;
            cursor: text;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* Ukrycie paska przewijania */
        #screen::-webkit-scrollbar {
            display: none;
        }
        #screen {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Mrugający kursor C64 */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 20px;
            background-color: var(--c64-light);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Ukryty input gwarantuje wysunięcie klawiatury na iOS/Android */
        #hidden-input {
            position: absolute;
            opacity: 0;
            top: -1000px;
            left: -1000px;
            font-size: 16px; /* Zabezpieczenie przed auto-zoomem na iPhone */
        }
    </style>
</head>
<body>

    <div id="monitor-border" onclick="document.getElementById('hidden-input').focus()">
        <div id="screen">
            <div id="output"></div>
            <input type="text" id="hidden-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>

    <script>
        const outputEl = document.getElementById('output');
        const inputEl = document.getElementById('hidden-input');
        const screenEl = document.getElementById('screen');

        let lines = [
            "    **** COMMODORE 64 BASIC V2 ****",
            "",
            " 64K RAM SYSTEM  38911 BASIC BYTES FREE",
            "",
            "READY."
        ];

        // Stan emulatora
        let program = {};
        let variables = {};
        let isRunning = false;
        let pc = -1; 

        // Rysowanie zawartości ekranu
        function render() {
            let html = lines.map(escapeHTML).join("<br>");
            let currentLine = escapeHTML(inputEl.value.toUpperCase());
            
            if (html.length > 0) html += "<br>";
            if (!isRunning) {
                html += currentLine;
                html += '<span class="cursor"></span>';
            }
            
            outputEl.innerHTML = html;
            screenEl.scrollTop = screenEl.scrollHeight; // Auto-scroll w dół
        }

        // Zabezpieczenie HTML i wymuszanie "twardych spacji" charakterystycznych dla C64
        function escapeHTML(str) {
            if (typeof str !== 'string') str = String(str);
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/ /g, '&nbsp;'); 
        }

        function printLine(text) {
            lines.push(text);
            if (lines.length > 400) lines.shift(); // Bufor historii ekranu by uniknąć wycieków pamięci
        }

        // Prosty system ewaluacji zmiennych i operacji matematycznych
        function evaluate(expr) {
            if (!expr || expr.trim() === "") return "";
            
            let out = "";
            let inQuotes = false;
            let currentVar = "";
            
            for (let i = 0; i < expr.length; i++) {
                let c = expr[i];
                if (c === '"') { 
                    inQuotes = !inQuotes; 
                    out += c; 
                    continue; 
                }
                
                if (!inQuotes) {
                    if (/[A-Z0-9\.]/i.test(c)) { 
                        currentVar += c;
                    } else {
                        if (currentVar) {
                            if (/[A-Z]/i.test(currentVar)) {
                                out += (variables[currentVar.toUpperCase()] !== undefined ? variables[currentVar.toUpperCase()] : 0);
                            } else {
                                out += currentVar; 
                            }
                            currentVar = "";
                        }
                        if (c === ';') out += '+';
                        else if (c === ',') out += '+"    "+';
                        else if (c === '=') out += '==';
                        else out += c;
                    }
                } else {
                    out += c;
                }
            }
            
            if (currentVar) {
                if (/[A-Z]/i.test(currentVar)) {
                    out += (variables[currentVar.toUpperCase()] !== undefined ? variables[currentVar.toUpperCase()] : 0);
                } else {
                    out += currentVar;
                }
            }

            try {
                let result = new Function('return ' + out)();
                return result === undefined ? "" : result;
            } catch(e) {
                return "ERROR";
            }
        }

        // Wykonanie pojedynczej komendy
        function executeLine(line, lineNumber = null) {
            // FIX: Obsługa dziwnych konstrukcji "GO TO", sklejonych poleceń itp.
            line = line.trim().replace(/\bGO\s+TO\b/gi, 'GOTO');
            if (!line) return;

            // Wyłapuje komendę ignorując ilość spacji za nią (lub ich całkowity brak np. GOTO10)
            let cmdMatch = line.match(/^\s*(PRINT|\?|GOTO|LIST|NEW|RUN|CLEAR|END|STOP|REM)\s*(.*)$/i);
            
            if (!cmdMatch) {
                // Być może to przypisanie zmiennej (A = 10)
                let assignMatch = line.match(/^([A-Z][A-Z0-9\$]*)\s*=\s*(.+)$/i);
                if (assignMatch) {
                    let val = evaluate(assignMatch[2]);
                    if (val === "ERROR") throw "SYNTAX";
                    variables[assignMatch[1].toUpperCase()] = val;
                    return;
                } else {
                    throw "SYNTAX";
                }
            }

            let cmd = cmdMatch[1].toUpperCase();
            let args = cmdMatch[2]; // Argumenty po komendzie

            switch(cmd) {
                case 'PRINT':
                case '?':
                    let res = evaluate(args);
                    if (res === "ERROR") throw "SYNTAX";
                    printLine(res.toString());
                    break;
                case 'GOTO':
                    let target = parseInt(evaluate(args));
                    if (program[target] !== undefined) {
                        pc = target;
                    } else {
                        throw "UNDEF'D STATEMENT";
                    }
                    break;
                case 'LIST':
                    let keys = Object.keys(program).map(Number).sort((a,b)=>a-b);
                    for (let n of keys) {
                        printLine(`${n} ${program[n]}`);
                    }
                    break;
                case 'NEW':
                    program = {};
                    variables = {};
                    break;
                case 'RUN':
                    variables = {};
                    let progKeys = Object.keys(program).map(Number).sort((a,b)=>a-b);
                    if (progKeys.length > 0) {
                        pc = progKeys[0];
                        isRunning = true;
                    }
                    break;
                case 'CLEAR':
                    lines = [];
                    break;
                case 'END':
                case 'STOP':
                    isRunning = false;
                    if (lineNumber !== null) printLine(`BREAK IN ${lineNumber}`);
                    break;
                case 'REM':
                    break; 
            }
        }

        // Asynchroniczna pętla zapobiegająca freezom przeglądarki w przypadku nieskończonych pętli
        async function programLoop() {
            while (isRunning) {
                let line = program[pc];
                if (line === undefined) {
                    isRunning = false;
                    printLine("READY.");
                    render();
                    break;
                }

                let currentPc = pc;
                try {
                    executeLine(line, currentPc);
                } catch (err) {
                    isRunning = false;
                    printLine(`?${err} ERROR IN ${currentPc}`);
                    printLine("READY.");
                    render();
                    break;
                }

                // Przeskocz do następnej linii, chyba że program wykonał skok (GOTO)
                if (pc === currentPc && isRunning) {
                    let keys = Object.keys(program).map(Number).sort((a,b)=>a-b);
                    let idx = keys.indexOf(pc);
                    if (idx > -1 && idx < keys.length - 1) {
                        pc = keys[idx + 1];
                    } else {
                        isRunning = false;
                        printLine("READY.");
                    }
                }
                
                render();
                
                // Kluczowy element - opóźnienie zapobiegające zamrożeniu okna przy (np. 10 PRINT "X", 20 GOTO 10)
                await new Promise(r => setTimeout(r, 10)); 
            }
        }

        // Wejście klawiatury
        function handleInput(rawCmd) {
            // Zamiana cudzysłowów ze smartfonów na tradycyjne
            let cmd = rawCmd.trim()
                .replace(/[\u201C\u201D]/g, '"')
                .replace(/[\u2018\u2019]/g, "'");

            if (cmd === "") return;
            
            printLine(cmd.toUpperCase());

            // Check czy użytkownik wpisał kod programu np. "10 PRINT..."
            let lineNumMatch = cmd.match(/^(\d+)\s*(.*)$/);
            if (lineNumMatch) {
                let num = parseInt(lineNumMatch[1]);
                let code = lineNumMatch[2];
                if (code === "") {
                    delete program[num];
                } else {
                    program[num] = code;
                }
                render();
                return;
            } 

            // Tryb bezpośredni (Immediate)
            try {
                executeLine(cmd);
                if (isRunning) {
                    programLoop(); // Rozpoczyna pętlę dla komendy RUN
                } else {
                    if (cmd.toUpperCase() !== "CLEAR") printLine("READY.");
                    render();
                }
            } catch (err) {
                printLine(`?${err} ERROR`);
                printLine("READY.");
                render();
            }
        }

        inputEl.addEventListener('input', render);

        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = inputEl.value;
                inputEl.value = '';
                
                // Awaryjne ręczne zatrzymywanie wykonywania nieskończonej pętli poleceniem STOP wpisanym w trakcie działania
                if (isRunning) {
                    if (cmd.toUpperCase().trim() === "STOP") {
                        isRunning = false;
                        printLine(`BREAK IN ${pc}`);
                        printLine("READY.");
                        render();
                    }
                    return; 
                }
                handleInput(cmd);
            }
        });

        // Wymuszenie klawiatury na urządzeniach dotykowych
        document.addEventListener('click', () => {
            inputEl.focus();
        });

        window.onload = () => {
            inputEl.focus();
            render();
        };

    </script>
</body>
</html>
